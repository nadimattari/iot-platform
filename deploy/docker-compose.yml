name: iiot-platform

x-app-placeholder: &app-placeholder
  restart: unless-stopped
  entrypoint: ["sleep", "infinity"]
  networks:
    - frontend
    - backend

services:
  caddy:
    # dunglas/mercure is a Caddy 2 build with the Mercure module included,
    # so the edge proxy and the SSE hub are hosted in one container.
    image: dunglas/mercure:v0.24.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Site address for the Caddyfile: ':80' = plain HTTP for local dev,
      # a real domain = automatic HTTPS via Let's Encrypt.
      SERVER_NAME: ${DOMAIN:-:80}
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY:?MERCURE_PUBLISHER_JWT_KEY must be set in deploy/.env}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_KEY:?MERCURE_SUBSCRIBER_JWT_KEY must be set in deploy/.env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/mercure/Caddyfile:/etc/caddy/mercure/Caddyfile:ro
      - ./caddy/static:/srv/dashboard:ro
      - caddy_data:/data
      - caddy_config:/config
      - mercure_data:/data/mercure
    networks:
      - frontend
      - backend
    healthcheck:
      # Transport-aware: the Mercure module registers a readiness probe on the
      # Caddy admin API (bound to localhost:2019 inside the container).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/mercure/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth:
    build:
      context: ../services/auth
    restart: unless-stopped
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: iiot
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      PGDATABASE: iiot
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      AUTH_JWT_KEYS_DIR: /keys
    volumes:
      - auth_keys:/keys
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  device-mgmt:
    build:
      context: ../services/device-mgmt
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set in deploy/.env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/iiot?serverVersion=16&charset=utf8
      DEFAULT_URI: http://localhost
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://auth:3000/auth/jwks}
      AUTH_JWKS_TTL: ${AUTH_JWKS_TTL:-3600}
      MQTT_PASSWD_FILE: /broker/creds/mosquitto.passwd
    volumes:
      # Shared with the mqtt broker so device credentials are provisioned here.
      - ./mqtt/data:/broker/creds
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ingestion:
    build:
      context: ../services/ingestion
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: iiot
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      PGDATABASE: iiot
      INGESTION_MQTT_USERNAME: ${INGESTION_MQTT_USERNAME:-ingestion}
      INGESTION_MQTT_PASSWORD: ${INGESTION_MQTT_PASSWORD:-change-me}
      INGESTION_MQTT_HOST: mqtt
      INGESTION_MQTT_PORT: "1883"
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      CHIRPSTACK_DB_USER: ${CHIRPSTACK_DB_USER}
      CHIRPSTACK_DB_PASSWORD: ${CHIRPSTACK_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mqtt:
    build: ./mqtt
    restart: unless-stopped
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["/mosquitto/entrypoint.sh"]
    environment:
      MOSQUITTO_USER: ${MOSQUITTO_USER:-broker}
      MOSQUITTO_PASSWORD: ${MOSQUITTO_PASSWORD:?MOSQUITTO_PASSWORD must be set in deploy/.env}
      INGESTION_MQTT_USERNAME: ${INGESTION_MQTT_USERNAME:-ingestion}
      INGESTION_MQTT_PASSWORD: ${INGESTION_MQTT_PASSWORD:-change-me}
      CHIRPSTACK_MQTT_USERNAME: ${CHIRPSTACK_MQTT_USERNAME:-chirpstack}
      CHIRPSTACK_MQTT_PASSWORD: ${CHIRPSTACK_MQTT_PASSWORD:-change-me}
    volumes:
      - mqtt_data:/mosquitto/data
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mqtt/acl:/mosquitto/config/acl
      - ./mqtt/entrypoint.sh:/mosquitto/entrypoint.sh:ro
      - ./mqtt/data:/mosquitto/creds
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -u \"$$MOSQUITTO_USER\" -P \"$$MOSQUITTO_PASSWORD\" -t 'health' -m 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chirpstack:
    image: chirpstack/chirpstack:4.18.0
    <<: *app-placeholder

  dashboard:
    image: nginx:alpine
    <<: *app-placeholder

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  db_data:
  redis_data:
  mqtt_data:
  caddy_data:
  caddy_config:
  mercure_data:
  auth_keys:
