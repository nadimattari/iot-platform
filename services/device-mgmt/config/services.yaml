# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(AUTH_JWKS_URL): 'http://auth:3000/auth/jwks'
    env(AUTH_JWKS_TTL): '3600'
    # Path to the shared Mosquitto password file. Empty = no broker configured;
    # provisioning MQTT device credentials then fails fast (BrokerProvisioningException).
    env(MQTT_PASSWD_FILE): ''
    # ChirpStack downlink publication (MQTT 3.1.1). Username/password are the
    # dedicated device-mgmt service account; the topic carries the ChirpStack
    # application ID.
    env(MQTT_HOST): 'mosquitto'
    env(MQTT_PORT): '1883'
    env(MQTT_DOWNLINK_USERNAME): ''
    env(MQTT_DOWNLINK_PASSWORD): ''
    env(CHIRPSTACK_APPLICATION_ID): ''
    # Mercure hub for live command/status events. Empty key = publishing
    # disabled (EventPublisher short-circuits); the hub URL points at the
    # Caddy front that terminates the public `/dashboard/` route.
    env(MERCURE_HUB_URL): 'http://caddy/.well-known/mercure'
    env(MERCURE_PUBLISHER_JWT_KEY): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Security\JwksProvider:
        arguments:
            $jwksUrl: '%env(AUTH_JWKS_URL)%'
            $ttl: '%env(int:AUTH_JWKS_TTL)%'

    # Autowiring target for DeviceService's BrokerCredentialProvisioner.
    App\Service\BrokerCredentialProvisioner:
        class: App\Service\MosquittoCredentialProvisioner
        arguments:
            $passwdFile: '%env(MQTT_PASSWD_FILE)%'

    # Command publisher used by DownlinkService (LoRaWAN) and MqttCommandService
    # (MQTT devices): one shared MQTT client wrapper, bound to both interfaces.
    App\Message\MqttPublisher:
        arguments:
            $host: '%env(MQTT_HOST)%'
            $port: '%env(int:MQTT_PORT)%'
            $username: '%env(MQTT_DOWNLINK_USERNAME)%'
            $password: '%env(MQTT_DOWNLINK_PASSWORD)%'
    App\Message\DownlinkPublisherInterface:
        alias: App\Message\MqttPublisher
    App\Message\MqttCommandPublisherInterface:
        alias: App\Message\MqttPublisher

    # DownlinkService needs the ChirpStack application ID to build the topic.
    App\Service\DownlinkService:
        arguments:
            $chirpstackApplicationId: '%env(CHIRPSTACK_APPLICATION_ID)%'

    # Publishes command/status events to the Mercure hub (Topic: /devices/{id}/commands).
    App\Service\EventPublisher:
        arguments:
            $hubUrl: '%env(MERCURE_HUB_URL)%'
            $jwtKey: '%env(MERCURE_PUBLISHER_JWT_KEY)%'
    App\Service\MercurePublisherInterface:
        alias: App\Service\EventPublisher

    # Long-running ACK/TxACK event consumer (console command).
    App\Consumer\ConsumeDownlinkEventsCommand:
        arguments:
            $host: '%env(MQTT_HOST)%'
            $port: '%env(int:MQTT_PORT)%'
            $username: '%env(MQTT_DOWNLINK_USERNAME)%'
            $password: '%env(MQTT_DOWNLINK_PASSWORD)%'
            $applicationId: '%env(CHIRPSTACK_APPLICATION_ID)%'

    # Long-running MQTT device ACK consumer (console command).
    App\Consumer\ConsumeMqttAckCommand:
        arguments:
            $host: '%env(MQTT_HOST)%'
            $port: '%env(int:MQTT_PORT)%'
            $username: '%env(MQTT_DOWNLINK_USERNAME)%'
            $password: '%env(MQTT_DOWNLINK_PASSWORD)%'
