# E2E test profile (Task 24).
#
# Spins up the whole platform stack from docker-compose.yml against a fresh
# database, adds mock devices for all four protocols (Modbus via mock-modbus,
# MQTT/HTTP/LoRaWAN via the tests/e2e drivers) and runs the E2E suite. The
# `e2e` service exits 0 on success, so the exit code of
#
#   docker compose -f deploy/docker-compose.test.yml up --exit-code-from e2e
#
# reflects the suite result (the acceptance command from the plan). Host ports
# are dropped so the test stack never collides with a running dev stack.
#
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/docker-compose.test.yml up --build --exit-code-from e2e
#   docker compose -f deploy/docker-compose.test.yml down -v
name: iiot-platform-e2e

include:
  - docker-compose.yml

services:
  # Fresh database per run; the shared DB volume and any host bindings must not
  # leak between projects.
  db:
    ports: !reset []
    volumes:
      - db_test_data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro

  # The dev services publish host ports; the test stack is reached over the
  # compose networks only (the e2e container talks to `caddy`/`mqtt`).
  caddy:
    ports: !reset []
  chirpstack:
    ports: !reset []
  chirpstack-gateway-bridge:
    ports: !reset []
  chirpstack-rest-api:
    ports: !reset []

  # auth connects to the DB at boot and exits hard if it is not ready yet (no
  # retry loop), which would abort the whole `--exit-code-from e2e` run. The
  # base compose starts it in parallel; the test profile makes it wait.
  auth:
    depends_on:
      db:
        condition: service_healthy

  # ingestion retries its DB pool at boot, but its tasks query migrated tables
  # (devices, modbus_register_config) — start it only once the schema is in
  # place so the poller/subscriber don't come up against an empty database.
  ingestion:
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_healthy

  # Migration runner: applies the Doctrine migrations before the suite starts.
  # `--exit-code-from e2e` implies --abort-on-container-exit, which aborts the
  # run the moment ANY container exits — including a one-shot migrate finishing.
  # So migrate stays up after migrating and reports completion via its
  # healthcheck instead (the e2e service waits for that condition).
  migrate:
    build:
      context: ../services/device-mgmt
    command:
      - sh
      - -c
      - bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration && touch /tmp/migrate-done && sleep infinity
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set in deploy/.env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/iiot?serverVersion=16&charset=utf8
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/migrate-done"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 0s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  # Raw Modbus TCP mock (FC03) that the ingestion poller reads from (Task 12).
  mock-modbus:
    build: ./mock-modbus
    networks:
      - backend

  e2e:
    build: ../tests/e2e
    depends_on:
      auth:
        condition: service_healthy
      caddy:
        condition: service_healthy
      db:
        condition: service_healthy
      device-mgmt:
        condition: service_healthy
      ingestion:
        condition: service_healthy
      migrate:
        condition: service_healthy
      mock-modbus:
        condition: service_started
      mqtt:
        condition: service_healthy
    environment:
      E2E_BASE_URL: http://caddy
      E2E_MQTT_HOST: mqtt
      E2E_MQTT_PORT: "1883"
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      CHIRPSTACK_APPLICATION_ID: ${CHIRPSTACK_APPLICATION_ID:?CHIRPSTACK_APPLICATION_ID must be set in deploy/.env}
      CHIRPSTACK_MQTT_USERNAME: ${CHIRPSTACK_MQTT_USERNAME:-chirpstack}
      CHIRPSTACK_MQTT_PASSWORD: ${CHIRPSTACK_MQTT_PASSWORD:?CHIRPSTACK_MQTT_PASSWORD must be set in deploy/.env}
    networks:
      - frontend
      - backend

volumes:
  db_test_data:
