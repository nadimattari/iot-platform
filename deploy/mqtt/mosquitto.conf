# Device MQTT broker (Task 7).
# Authentication and per-device ACLs only. Every client must authenticate:
# device-mgmt provisions devices/{device-id}/# credentials, and service accounts
# (broker, chirpstack, ingestion) are seeded on first boot.

persistence true
persistence_location /mosquitto/data/

per_listener_settings false

# Authentication
allow_anonymous false
password_file /mosquitto/creds/mosquitto.passwd

# Authorization (first matching rule wins)
acl_file /mosquitto/config/acl

# Drop privileges after reading config (mosquitto user, uid 1883).
# Handled by the entrypoint (su mosquitto), not here, so the strict
# root-only permission checks on the passwd file are skipped.
listener 1883
protocol mqtt

log_dest stdout
log_type all
connection_messages true
