name: iiot-platform

# Task 23 hardening: keep every service's logs size-capped so a chatty
# container can't fill the disk. Compose's x- extension allows a shared anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  caddy:
    # dunglas/mercure is a Caddy 2 build with the Mercure module included,
    # so the edge proxy and the SSE hub are hosted in one container.
    image: dunglas/mercure:v0.24.2
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Site address for the Caddyfile: ':80' = plain HTTP for local dev,
      # a real domain = automatic HTTPS via Let's Encrypt.
      SERVER_NAME: ${DOMAIN:-:80}
      CHIRPSTACK_SITE_ADDR: ${CHIRPSTACK_SITE_ADDR:-http://chirpstack.localhost}
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY:?MERCURE_PUBLISHER_JWT_KEY must be set in deploy/.env}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_KEY:?MERCURE_SUBSCRIBER_JWT_KEY must be set in deploy/.env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/mercure/Caddyfile:/etc/caddy/mercure/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - mercure_data:/data/mercure
    networks:
      - frontend
      - backend
    healthcheck:
      # Transport-aware: the Mercure module registers a readiness probe on the
      # Caddy admin API (bound to localhost:2019 inside the container).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/mercure/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth:
    build:
      context: ../services/auth
    restart: unless-stopped
    logging: *default-logging
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: iiot
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      PGDATABASE: iiot
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      AUTH_JWT_KEYS_DIR: /keys
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_KEY:?MERCURE_SUBSCRIBER_JWT_KEY must be set in deploy/.env}
    volumes:
      - auth_keys:/keys
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  device-mgmt:
    build:
      context: ../services/device-mgmt
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set in deploy/.env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/iiot?serverVersion=16&charset=utf8
      DEFAULT_URI: http://localhost
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://auth:3000/auth/jwks}
      AUTH_JWKS_TTL: ${AUTH_JWKS_TTL:-3600}
      MQTT_PASSWD_FILE: /broker/creds/mosquitto.passwd
      # ChirpStack downlink (Task 16): the MQTT integration runs on the shared
      # broker; the topic is application/<id>/device/<eui>/command/down.
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_DOWNLINK_USERNAME: ${DEVICE_MGMT_MQTT_USERNAME:-device-mgmt}
      MQTT_DOWNLINK_PASSWORD: ${DEVICE_MGMT_MQTT_PASSWORD:-change-me}
      CHIRPSTACK_APPLICATION_ID: ${CHIRPSTACK_APPLICATION_ID:?CHIRPSTACK_APPLICATION_ID must be set in deploy/.env}
      # Mercure command/status events (Task 18).
      MERCURE_HUB_URL: ${MERCURE_HUB_URL:-http://caddy/.well-known/mercure}
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY:-change-me}
    volumes:
      # Shared with the mqtt broker so device credentials are provisioned here.
      - ./mqtt/data:/broker/creds
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  device-mgmt-consumer:
    # Long-running ChirpStack ACK/TxACK event consumer (Task 16): updates
    # command status when a confirmed downlink is acked or times out.
    build:
      context: ../services/device-mgmt
    restart: unless-stopped
    logging: *default-logging
    command: ["bin/console", "app:consume-downlink-events"]
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set in deploy/.env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/iiot?serverVersion=16&charset=utf8
      MQTT_PASSWD_FILE: /broker/creds/mosquitto.passwd
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_DOWNLINK_USERNAME: ${DEVICE_MGMT_MQTT_USERNAME:-device-mgmt}
      MQTT_DOWNLINK_PASSWORD: ${DEVICE_MGMT_MQTT_PASSWORD:-change-me}
      CHIRPSTACK_APPLICATION_ID: ${CHIRPSTACK_APPLICATION_ID:?CHIRPSTACK_APPLICATION_ID must be set in deploy/.env}
      # Mercure command/status events (Task 18).
      MERCURE_HUB_URL: ${MERCURE_HUB_URL:-http://caddy/.well-known/mercure}
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY:-change-me}
    # The base image ships a FrankenPHP HTTP healthcheck; this container runs
    # the long-lived consumer command instead, so check the worker process.
    healthcheck:
      test: ["CMD-SHELL", "ps -eo args | grep -v grep | grep -q 'app:consume-downlink-events' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./mqtt/data:/broker/creds
    networks:
      - backend

  device-mgmt-consumer-acks:
    # Long-running MQTT device ACK consumer (Task 17): updates command status
    # when a device confirms a command on devices/{id}/ack.
    build:
      context: ../services/device-mgmt
    restart: unless-stopped
    logging: *default-logging
    command: ["bin/console", "app:consume-mqtt-acks"]
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set in deploy/.env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/iiot?serverVersion=16&charset=utf8
      MQTT_PASSWD_FILE: /broker/creds/mosquitto.passwd
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_DOWNLINK_USERNAME: ${DEVICE_MGMT_MQTT_USERNAME:-device-mgmt}
      MQTT_DOWNLINK_PASSWORD: ${DEVICE_MGMT_MQTT_PASSWORD:-change-me}
      # Mercure command/status events (Task 18).
      MERCURE_HUB_URL: ${MERCURE_HUB_URL:-http://caddy/.well-known/mercure}
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY:-change-me}
    # The base image ships a FrankenPHP HTTP healthcheck; this container runs
    # the long-lived consumer command instead, so check the worker process.
    healthcheck:
      test: ["CMD-SHELL", "ps -eo args | grep -v grep | grep -q 'app:consume-mqtt-acks' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./mqtt/data:/broker/creds
    networks:
      - backend

  ingestion:
    build:
      context: ../services/ingestion
    restart: unless-stopped
    logging: *default-logging
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: iiot
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      PGDATABASE: iiot
      INGESTION_MQTT_USERNAME: ${INGESTION_MQTT_USERNAME:-ingestion}
      INGESTION_MQTT_PASSWORD: ${INGESTION_MQTT_PASSWORD:-change-me}
      INGESTION_MQTT_HOST: mqtt
      INGESTION_MQTT_PORT: "1883"
      # Mercure real-time events (Task 18): publish normalized telemetry to the
      # hub behind the Caddy edge. Internal hostname resolves on the backend
      # network; the key signs per-topic publish JWTs.
      MERCURE_HUB_URL: ${MERCURE_HUB_URL:-http://caddy/.well-known/mercure}
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY:-change-me}
    networks:
      - frontend
      - backend
    healthcheck:
      # Healthy only when the DB pool is connected; /health always returns 200
      # (status body carries the db field), so grep the body.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8000/health | grep -q '\"db\":\"connected\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      CHIRPSTACK_DB_USER: ${CHIRPSTACK_DB_USER}
      CHIRPSTACK_DB_PASSWORD: ${CHIRPSTACK_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - frontend
      - backend
    healthcheck:
      # Force TCP: `pg_isready` without -h checks the local Unix socket, which
      # answers during the docker-entrypoint init phase while TCP is still
      # closed — letting TCP clients (auth, migrate, device-mgmt, ingestion)
      # start too early and fail with ECONNREFUSED.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mqtt:
    build: ./mqtt
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["/mosquitto/entrypoint.sh"]
    environment:
      MOSQUITTO_USER: ${MOSQUITTO_USER:-broker}
      MOSQUITTO_PASSWORD: ${MOSQUITTO_PASSWORD:?MOSQUITTO_PASSWORD must be set in deploy/.env}
      INGESTION_MQTT_USERNAME: ${INGESTION_MQTT_USERNAME:-ingestion}
      INGESTION_MQTT_PASSWORD: ${INGESTION_MQTT_PASSWORD:-change-me}
      CHIRPSTACK_MQTT_USERNAME: ${CHIRPSTACK_MQTT_USERNAME:-chirpstack}
      CHIRPSTACK_MQTT_PASSWORD: ${CHIRPSTACK_MQTT_PASSWORD:-change-me}
      DEVICE_MGMT_MQTT_USERNAME: ${DEVICE_MGMT_MQTT_USERNAME:-device-mgmt}
      DEVICE_MGMT_MQTT_PASSWORD: ${DEVICE_MGMT_MQTT_PASSWORD:-change-me}
    volumes:
      - mqtt_data:/mosquitto/data
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mqtt/acl:/mosquitto/config/acl
      - ./mqtt/entrypoint.sh:/mosquitto/entrypoint.sh:ro
      - ./mqtt/data:/mosquitto/creds
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -u \"$$MOSQUITTO_USER\" -P \"$$MOSQUITTO_PASSWORD\" -t 'health' -m 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chirpstack:
    # LoRaWAN Network Server + Application Server (Task 14). Config directory
    # contains chirpstack.toml plus region_eu868.toml (all merged on startup).
    image: chirpstack/chirpstack:4.18.0
    restart: unless-stopped
    logging: *default-logging
    command: ["-c", "/etc/chirpstack"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    environment:
      CHIRPSTACK_DB_USER: ${CHIRPSTACK_DB_USER:-chirpstack}
      CHIRPSTACK_DB_PASSWORD: ${CHIRPSTACK_DB_PASSWORD:?CHIRPSTACK_DB_PASSWORD must be set in deploy/.env}
      CHIRPSTACK_REDIS_DB: ${CHIRPSTACK_REDIS_DB:-0}
      CHIRPSTACK_REGION: ${CHIRPSTACK_REGION:-eu868}
      CHIRPSTACK_MQTT_USERNAME: ${CHIRPSTACK_MQTT_USERNAME:-chirpstack}
      CHIRPSTACK_MQTT_PASSWORD: ${CHIRPSTACK_MQTT_PASSWORD:?CHIRPSTACK_MQTT_PASSWORD must be set in deploy/.env}
      CHIRPSTACK_API_SECRET: ${CHIRPSTACK_API_SECRET:?CHIRPSTACK_API_SECRET must be set in deploy/.env}
    volumes:
      - ./chirpstack/:/etc/chirpstack/:ro
    ports:
      - "8080:8080"
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  chirpstack-gateway-bridge:
    # Semtech UDP <-> MQTT bridge for packet-forwarder gateways (UDP 1700).
    # Topic templates are fixed for the eu868 gateway namespace so they match
    # the Network Server gateway backend (region_eu868.toml).
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    logging: *default-logging
    # No command: the default config path is
    # /etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge.toml (matches
    # the mount below). Unlike chirpstack, -c expects a file, not a directory.
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE: "eu868/gateway/{{ .GatewayID }}/event/{{ .EventType }}"
      INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE: "eu868/gateway/{{ .GatewayID }}/state/{{ .StateType }}"
      INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE: "eu868/gateway/{{ .GatewayID }}/command/#"
      INTEGRATION__MQTT__AUTH__GENERIC__USERNAME: ${CHIRPSTACK_MQTT_USERNAME:-chirpstack}
      INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD: ${CHIRPSTACK_MQTT_PASSWORD:?CHIRPSTACK_MQTT_PASSWORD must be set in deploy/.env}
    volumes:
      - ./chirpstack/gateway-bridge/:/etc/chirpstack-gateway-bridge/:ro
    ports:
      - "1700:1700/udp"
    # Gateway packet-forwarders must reach UDP 1700 from the LAN, and
    # published ports are dropped on internal-only networks — so the bridge
    # is also attached to the (non-internal) frontend network.
    networks:
      - backend
      - frontend
    healthcheck:
      # Long-lived process; verify the bridge worker is still running.
      test: ["CMD-SHELL", "ps -eo args | grep -v grep | grep -q 'chirpstack-gateway-bridge' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  chirpstack-rest-api:
    # REST facade over the ChirpStack gRPC API. The platform (device-mgmt)
    # provisions applications/devices through this endpoint (Tasks 15-17);
    # --insecure because the gRPC transport to chirpstack:8080 is unencrypted
    # inside the internal network (see Task 23 hardening).
    image: chirpstack/chirpstack-rest-api:4
    restart: unless-stopped
    logging: *default-logging
    command: ["--server", "chirpstack:8080", "--bind", "0.0.0.0:8090", "--insecure"]
    depends_on:
      chirpstack:
        condition: service_healthy
    ports:
      - "8090:8090"
    # Frontend network is required for host port publishing (see gateway-bridge).
    networks:
      - backend
      - frontend
    healthcheck:
      # gRPC-gateway proxy; verify the worker process is alive.
      test: ["CMD-SHELL", "ps -eo args | grep -v grep | grep -q 'chirpstack-rest-api' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  dashboard:
    build:
      context: ../services/dashboard
    restart: unless-stopped
    logging: *default-logging
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  db_data:
  redis_data:
  mqtt_data:
  caddy_data:
  caddy_config:
  mercure_data:
  auth_keys:
